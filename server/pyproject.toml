[project]
name = "claude-blender-mcp"
version = "0.1.0"
description = "MCP server that lets Claude drive Blender through the claude_blender addon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claude-blender-mcp = "claude_blender_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_blender_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
